<!doctype html>
<html lang="en">
    <head>
        <meta charset="utf-8" />
        <!-- Prevent Safari from pausing WebGL due to zoom/scroll gestures -->
        <meta
            name="viewport"
            content="width=device-width, initial-scale=1.0, user-scalable=no, maximum-scale=1.0"
        />
        <meta name="apple-mobile-web-app-capable" content="yes" />
        <meta
            name="apple-mobile-web-app-status-bar-style"
            content="black-translucent"
        />
        <title>FlappyBirdGame</title>
        <style>
            html,
            body,
            #canvas {
                margin: 0;
                padding: 0;
                border: 0;
            }

            body {
                color: white;
                background-color: black;
                overflow: hidden;
                touch-action: none;
                -webkit-user-select: none;
                -webkit-touch-callout: none;
                -webkit-tap-highlight-color: transparent;
            }

            #canvas {
                display: block;
                width: 100%;
                height: 100%;
                touch-action: none;
            }

            #canvas:focus {
                outline: none;
            }

            #status,
            #status-splash,
            #status-progress {
                position: absolute;
                left: 0;
                right: 0;
            }

            #status,
            #status-splash {
                top: 0;
                bottom: 0;
            }

            #status {
                background-color: #242424;
                display: flex;
                flex-direction: column;
                justify-content: center;
                align-items: center;
                visibility: hidden;
            }

            #status-splash {
                max-height: 100%;
                max-width: 100%;
                margin: auto;
            }

            #status-splash.show-image--false {
                display: none;
            }
            #status-splash.fullsize--true {
                height: 100%;
                width: 100%;
                object-fit: contain;
            }
            #status-splash.use-filter--false {
                image-rendering: pixelated;
            }

            #status-progress,
            #status-notice {
                display: none;
            }
            #status-progress {
                bottom: 10%;
                width: 50%;
                margin: 0 auto;
            }
            #status-notice {
                background-color: #5b3943;
                border-radius: 0.5rem;
                border: 1px solid #9b3943;
                color: #e0e0e0;
                font-family: "Noto Sans", "Droid Sans", Arial, sans-serif;
                line-height: 1.3;
                margin: 0 2rem;
                overflow: hidden;
                padding: 1rem;
                text-align: center;
                z-index: 1;
            }
        </style>
        <link
            id="-gd-engine-icon"
            rel="icon"
            type="image/png"
            href="FlappyBirdGame.icon.png"
        />
        <link
            rel="apple-touch-icon"
            href="FlappyBirdGame.apple-touch-icon.png"
        />
        <link rel="manifest" href="FlappyBirdGame.manifest.json" />
    </head>
    <body>
        <canvas id="canvas"
            >Your browser does not support the canvas tag.</canvas
        >

        <noscript>Your browser does not support JavaScript.</noscript>

        <div id="status">
            <img
                id="status-splash"
                class="show-image--true fullsize--true use-filter--true"
                src="FlappyBirdGame.png"
                alt=""
            />
            <progress id="status-progress"></progress>
            <div id="status-notice"></div>
        </div>

        <script src="FlappyBirdGame.js"></script>

        <!-- Pre-warm AudioContext on first touch to avoid Safari lag -->
        <script>
            document.addEventListener(
                "touchstart",
                function warmUpAudio() {
                    if (typeof AudioContext !== "undefined") {
                        try {
                            const ctx = new AudioContext();
                            const src = ctx.createBufferSource();
                            src.buffer = ctx.createBuffer(1, 1, 22050);
                            src.connect(ctx.destination);
                            src.start(0);
                            ctx.resume();
                        } catch (e) {}
                    }
                    document.removeEventListener("touchstart", warmUpAudio);
                },
                { passive: true },
            );
        </script>

        <script>
            // Detect iOS to disable threads
            const isIOS = /iPad|iPhone|iPod/.test(navigator.userAgent);
            const GODOT_THREADS_ENABLED = !isIOS;

            const GODOT_CONFIG = {
                args: [],
                canvasResizePolicy: 2,
                ensureCrossOriginIsolationHeaders: true,
                executable: "FlappyBirdGame",
                experimentalVK: false,
                fileSizes: {
                    "FlappyBirdGame.pck": 2377776,
                    "FlappyBirdGame.wasm": 1648449,
                },
                focusCanvas: true,
                gdextensionLibs: [],
                serviceWorker: "FlappyBirdGame.service.worker.js",
            };

            const engine = new Engine(GODOT_CONFIG);

            (function () {
                const statusOverlay = document.getElementById("status");
                const statusProgress =
                    document.getElementById("status-progress");
                const statusNotice = document.getElementById("status-notice");

                let initializing = true;
                let statusMode = "";

                function setStatusMode(mode) {
                    if (statusMode === mode || !initializing) return;
                    if (mode === "hidden") {
                        statusOverlay.remove();
                        initializing = false;
                        return;
                    }
                    statusOverlay.style.visibility = "visible";
                    statusProgress.style.display =
                        mode === "progress" ? "block" : "none";
                    statusNotice.style.display =
                        mode === "notice" ? "block" : "none";
                    statusMode = mode;
                }

                function setStatusNotice(text) {
                    while (statusNotice.lastChild)
                        statusNotice.removeChild(statusNotice.lastChild);
                    const lines = text.split("\n");
                    lines.forEach((line) => {
                        statusNotice.appendChild(document.createTextNode(line));
                        statusNotice.appendChild(document.createElement("br"));
                    });
                }

                function displayFailureNotice(err) {
                    console.error(err);
                    if (err instanceof Error) setStatusNotice(err.message);
                    else if (typeof err === "string") setStatusNotice(err);
                    else setStatusNotice("An unknown error occurred.");
                    setStatusMode("notice");
                    initializing = false;
                }

                const missing = Engine.getMissingFeatures({
                    threads: GODOT_THREADS_ENABLED,
                });

                if (missing.length !== 0) {
                    displayFailureNotice(
                        "Error\nMissing features:\n" + missing.join("\n"),
                    );
                } else {
                    setStatusMode("progress");
                    engine
                        .startGame({
                            onProgress: function (current, total) {
                                if (current > 0 && total > 0) {
                                    statusProgress.value = current;
                                    statusProgress.max = total;
                                } else {
                                    statusProgress.removeAttribute("value");
                                    statusProgress.removeAttribute("max");
                                }
                            },
                        })
                        .then(() => {
                            setStatusMode("hidden");
                            // Focus canvas after start to reduce touch lag
                            const canvas = document.getElementById("canvas");
                            setTimeout(() => canvas.focus(), 50);
                        }, displayFailureNotice);
                }
            })();
        </script>
    </body>
</html>
